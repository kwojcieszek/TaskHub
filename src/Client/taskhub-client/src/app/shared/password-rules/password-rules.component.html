<ul class="password-rules">
  @for (rule of rules; track rule.labelKey) {
    <li class="password-rules__item" [class.password-rules__item--met]="rule.met">
      <i class="pi" [class.pi-check-circle]="rule.met" [class.pi-circle]="!rule.met"></i>
      {{ rule.labelKey | translate: rule.labelParams }}
    </li>
  }
</ul>
