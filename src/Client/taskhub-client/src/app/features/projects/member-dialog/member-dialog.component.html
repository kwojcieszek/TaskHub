<div class="dialog-form">
  <div class="field">
    <label for="userSearch">{{ 'common.search' | translate }}</label>
    <input pInputText id="userSearch" [formControl]="searchControl" class="w-full" [placeholder]="'users.searchPlaceholder' | translate" />
    <small class="field-hint">{{ 'users.searchHint' | translate }}</small>
  </div>

  @if (results().length > 0) {
  <p-listbox
    [options]="results()"
    [ngModel]="selectedUser()"
    (ngModelChange)="selectedUser.set($event)"
    optionLabel="displayName"
    [ngModelOptions]="{ standalone: true }"
    styleClass="w-full member-listbox"
  >
    <ng-template #item let-user>
      <span>{{ user.displayName }}@if (user.userName) { ({{ user.userName }}) }</span>
    </ng-template>
  </p-listbox>
  }

  <div class="field">
    <label for="role">{{ 'projects.role' | translate }}</label>
    <p-select appendTo="body" inputId="role" [formControl]="roleControl" [options]="roleOptions" optionLabel="label" optionValue="value" styleClass="w-full" />
  </div>

  <div class="dialog-actions">
    <p-button [label]="'common.cancel' | translate" severity="secondary" [outlined]="true" type="button" (onClick)="cancel()" />
    <p-button [label]="'common.save' | translate" icon="pi pi-check" type="button" [disabled]="!selectedUser() || save.pending()" [loading]="save.pending()" (onClick)="submit()" />
  </div>
</div>
