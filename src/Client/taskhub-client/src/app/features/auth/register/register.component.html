<div class="auth-page">
  <app-theme-switch class="auth-page__theme" />

  <div class="auth-card">
    <div class="auth-card__brand">
      <img class="auth-card__logo" src="logo.svg" alt="" />
      <span>{{ 'app.name' | translate }}</span>
    </div>
    <h1 class="auth-card__title">{{ 'auth.registerTitle' | translate }}</h1>
    <p class="auth-card__subtitle">{{ 'auth.registerHint' | translate }}</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="field">
        <label for="displayName">{{ 'auth.displayName' | translate }}</label>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-id-card" />
          <input pInputText id="displayName" type="text" formControlName="displayName" class="w-full" />
        </p-iconfield>
      </div>

      <div class="field">
        <label for="userName">{{ 'auth.userName' | translate }}</label>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-user" />
          <input pInputText id="userName" type="text" formControlName="userName" autocomplete="username" class="w-full" />
        </p-iconfield>
      </div>

      <div class="field">
        <label for="email">{{ 'auth.email' | translate }}</label>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-envelope" />
          <input pInputText id="email" type="email" formControlName="email" autocomplete="email" class="w-full" />
        </p-iconfield>
      </div>

      <div class="field">
        <label for="password">{{ 'auth.password' | translate }}</label>
        <p-iconfield>
          <p-inputicon styleClass="pi pi-lock" />
          <p-password
            inputId="password"
            formControlName="password"
            [feedback]="false"
            [toggleMask]="true"
            inputStyleClass="w-full"
            styleClass="w-full"
          />
        </p-iconfield>
      </div>

      @if (errorMessage()) {
        <p-message severity="error" [text]="errorMessage()!" styleClass="w-full" />
      }

      @if (success()) {
        <p-message severity="success" [text]="'auth.registerSuccess' | translate" styleClass="w-full" />
      }

      <p-button
        [label]="'auth.register' | translate"
        icon="pi pi-user-plus"
        iconPos="right"
        type="submit"
        [loading]="loading()"
        [disabled]="form.invalid"
        styleClass="w-full auth-submit"
      />
    </form>

    <p class="auth-switch">
      {{ 'auth.haveAccount' | translate }}
      <a routerLink="/login">{{ 'auth.login' | translate }}</a>
    </p>
  </div>
</div>
