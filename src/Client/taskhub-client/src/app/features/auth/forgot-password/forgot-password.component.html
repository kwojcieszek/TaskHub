<div class="auth-page">
  <app-theme-switch class="auth-page__theme" />

  <div class="auth-card">
    <div class="auth-card__brand">
      <img class="auth-card__logo" src="logo.svg" alt="" />
      <span>{{ 'app.name' | translate }}</span>
    </div>
    <h1 class="auth-card__title">{{ 'auth.forgotTitle' | translate }}</h1>
    <p class="auth-card__subtitle">{{ 'auth.forgotHint' | translate }}</p>

    @if (sent()) {
      <p-message severity="success" [text]="'auth.resetLinkSent' | translate" styleClass="w-full" />
    } @else {
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label for="email">{{ 'auth.email' | translate }}</label>
          <p-iconfield>
            <p-inputicon styleClass="pi pi-envelope" />
            <input pInputText id="email" type="email" formControlName="email" autocomplete="email" class="w-full" />
          </p-iconfield>
        </div>

        @if (errorKey()) {
          <p-message severity="error" [text]="errorKey()! | translate" styleClass="w-full" />
        }

        <p-button
          [label]="'auth.sendResetLink' | translate"
          icon="pi pi-send"
          iconPos="right"
          type="submit"
          [loading]="loading()"
          [disabled]="form.invalid"
          styleClass="w-full auth-submit"
        />
      </form>
    }

    <p class="auth-switch">
      <a routerLink="/login">{{ 'auth.backToLogin' | translate }}</a>
    </p>
  </div>
</div>
