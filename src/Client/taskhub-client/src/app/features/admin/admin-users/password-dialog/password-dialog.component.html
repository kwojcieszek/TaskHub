<form [formGroup]="form" (ngSubmit)="submit()" class="dialog-form">
  <div class="field">
    <label for="resetPassword">{{ 'profile.newPassword' | translate }}</label>
    <p-password inputId="resetPassword" formControlName="newPassword" [feedback]="false" [toggleMask]="true" autocomplete="new-password" styleClass="w-full" inputStyleClass="w-full" />
    <app-password-rules [password]="form.controls.newPassword.value" />
    <small class="secondary">{{ 'admin.assignedPasswordHint' | translate }}</small>
  </div>

  <div class="dialog-actions">
    <p-button [label]="'common.cancel' | translate" severity="secondary" [outlined]="true" type="button" (onClick)="cancel()" />
    <p-button [label]="'common.save' | translate" icon="pi pi-check" type="submit" [disabled]="form.invalid || save.pending()" [loading]="save.pending()" />
  </div>
</form>
